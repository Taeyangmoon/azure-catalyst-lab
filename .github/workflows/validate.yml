name: validate
on:
  push:
  pull_request:
jobs:
  java-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Build legacy order portal (JDK 8)
        working-directory: apps/legacy-orders
        run: mvn -B -ntp package
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CMDB 내보내기가 스크립트와 일치하는지 확인
        run: |
          python3 scripts/generate_cmdb_export.py
          git diff --exit-code data/servicenow_cmdb_export.csv
